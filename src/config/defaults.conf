# Astra 出厂默认值（首次启动复制到 /data/adb/Astra/config.conf）

# 温控：official / off / mask —— 默认官方，什么都不动
THERMAL_MODE=official

# ---- 温度伪装 ----
# 系统可见温度（毫摄氏度）：26600 = 26.6℃
MASK_BASE=26600
# 自动上下浮动幅度（毫摄氏度）：400 = ±0.4℃
MASK_AMP=400
# 浮动周期（秒）
MASK_PERIOD=180
# 1 = 拉高真实温控墙 +3℃
RAISE_WALL=0
# 熔断线（毫摄氏度）
MASK_FUSE_BATT=45000
MASK_FUSE_SOC=95000

# ---- 充电电流限制请求 ----
CHARGE_AUTO=0
CHARGE_NOW=0
CHARGE_TEMP_CUT=45000

# ---- 调度 ----
# 1 = 开启官调限频（游戏中 / Scene 接管时自动暂停）
SAVE_ENABLED=0
# 1 = 禁用 GPU Boost（限制 GPU 上限）；0 = 系统默认。开启官调限频时强制为 1
DISABLE_GPU_BOOST=0
# 1 = 深度睡眠（熄屏 20 秒且未充电进入 doze；音乐/通话/亮屏/充电立即退出）
DEEP_SLEEP=0
# 1 = 双电芯补偿（整组电压 = 单芯 ×2，用于功率换算）
DUAL_COMP=1

# 界面语言 zh / en
LANG=zh
